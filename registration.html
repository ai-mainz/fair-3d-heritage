<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons -->
    <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />

    <!-- Optional: fallback PNG sizes -->
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/assets/favicon/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/favicon/web-app-manifest-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/assets/favicon/web-app-manifest-512x512.png"
    />

    <title>Registration | FAIR 3D Heritage</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="page">
    <!-- TOPNAV -->
    <div id="site-header" data-active="registration"></div>

    <main id="main">
      <!-- HERO -->
      <section
        class="page-hero page-hero--registration"
        aria-label="Registration hero"
      >
        <img
          class="page-hero__bg"
          src="assets/registration-hero-bg-1440.png"
          alt=""
          aria-hidden="true"
        />
        <div class="page-hero__overlay">
          <div class="container">
            <h1 class="page-hero__title reveal on-load delay-2">
              REGISTRATION
            </h1>
          </div>
        </div>
      </section>

      <!-- CONTENT -->
      <section class="section page-content">
        <div class="container">
          <div class="prose reveal">
            <p>The registration will open in April 2026.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <h2 class="visually-hidden">Footer</h2>
      <div class="container footer">
        <p class="footnote">© FAIR 3D Heritage</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
